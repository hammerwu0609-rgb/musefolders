[project]
name = "musefolders"
version = "0.1.0"
description = "Offline-first music library encoder and folder compiler for the TME hackathon"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "librosa>=0.11,<0.12",
  "mediapipe>=0.10.21,<1.1",
  "mutagen>=1.47,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pillow>=10,<13",
  "plotly>=6.0,<7",
  "soundfile>=0.13,<0.14",
  "streamlit>=1.64,<2",
  "tinytag>=2.1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]
sonic = ["onnxruntime>=1.22,<2", "umap-learn>=0.5.9,<0.6"]
lyrics = ["sentence-transformers>=5.1,<6", "umap-learn>=0.5.9,<0.6", "fasttext-community==0.11.8"]

[project.scripts]
musefolders = "musefolders.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musefolders"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

